  - n_words: 4
    english: "and to do righteousness of which You approve."
  - n_words: 5
    english: "And admit me by Your mercy into [the ranks of] Your righteous servants.\""
  - n_words: 3
    english: "And he took attendance of the birds and said,"
  - n_words: 5
    english: "\"Why do I not see the hoopoe -"
  - n_words: 4
    english: "or is he among the absent?"
  - n_words: 3
    english: "I will surely punish him with a severe punishment"
  - n_words: 2
    english: "or slaughter him"
