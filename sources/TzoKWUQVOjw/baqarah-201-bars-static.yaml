# Surah Al-Baqarah 2:201-202 & Al-Hujurat 49:6 - Shahat Muhammad Anwar (Maqam Hijaz) - bars_static style
style: bars_static
signature: "Revelation.mp3"
reciter: "Shahat Muhammad Anwar"
reciter_ar: "الشحات محمد أنور"
background_image: "bg.jpg"

verses:
  - "2:201"
  - "2:201"
  - "2:202"
  - "49:6"

trim: [0.0, 180.0]
fx: {heat: false}

groups:
  # First recitation of 2:201 (14 words)
  - n_words: 3
    line_split: 2
  - n_words: 5
    line_split: 2
  - n_words: 3
    line_split: 2
  - n_words: 3
    line_split: 2
  # Second recitation of 2:201 (14 words)
  - n_words: 3
    line_split: 2
  - n_words: 5
    line_split: 2
  - n_words: 3
    line_split: 2
  - n_words: 3
    line_split: 2
  # Recitation of 2:202 (8 words)
  - n_words: 5
    line_split: 3
  - n_words: 3
    line_split: 2
  # Recitation of 49:6 (17 words)
  - n_words: 7
    line_split: 4
  - n_words: 5
    line_split: 3
  - n_words: 5
    line_split: 3
